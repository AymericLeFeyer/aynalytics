# Aynalytics : deux conteneurs, un dossier data commun (base SQLite partagee).
# Publication via Pangolin : les conteneurs rejoignent le reseau Docker de Pangolin,
# Traefik (Pangolin) les joint par leur nom. Aucun port n'est publie sur Internet.
# 1. cp .env.example .env et remplir les valeurs
# 2. mkdir -p data && sudo chown 1000:1000 data
# 3. docker compose up -d   (images GHCR, ou --build pour construire localement)
# 4. Pangolin : ressource publique -> aynalytics-collector:8080, ressource protegee (SSO) -> aynalytics-dashboard:8081
name: aynalytics

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    - ${DATA_PATH:-./data}:/data
  networks:
    - proxy

services:
  collector:
    <<: *hardening
    container_name: aynalytics-collector
    image: ghcr.io/aymericlefeyer/aynalytics-collector:${TAG:-latest}
    build:
      context: .
      target: collector
    environment:
      # Reseaux Docker prives : couvre Traefik/Gerbil de Pangolin pour lire X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-loopback,172.16.0.0/12,10.0.0.0/8}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-240}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  dashboard:
    <<: *hardening
    container_name: aynalytics-dashboard
    image: ghcr.io/aymericlefeyer/aynalytics-dashboard:${TAG:-latest}
    build:
      context: .
      target: dashboard
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?BASIC_AUTH_USER est requis}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?BASIC_AUTH_PASSWORD est requis}
      COLLECTOR_PUBLIC_URL: ${COLLECTOR_PUBLIC_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}

networks:
  proxy:
    name: ${PROXY_NETWORK:-pangolin}
    external: true
